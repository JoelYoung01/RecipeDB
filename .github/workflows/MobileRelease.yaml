name: Mobile Release (iOS)

# Builds, signs, and uploads the iOS app to TestFlight whenever mobile code
# lands on main. Requires the Apple credentials documented in mobile/README.md
# (App Store Connect API key + team id); until those secrets exist the signed
# build is skipped with a warning so the workflow stays green.

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/MobileRelease.yaml"
  workflow_dispatch:

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  BuildIOS:
    name: Build, sign & upload to TestFlight
    runs-on: [macos-15]
    defaults:
      run:
        working-directory: mobile
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Apple signing secrets
        id: creds
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_PRIVATE_KEY" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets (ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY, APPLE_TEAM_ID) are not configured — skipping the signed iOS build. See mobile/README.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.creds.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PNPM
        if: steps.creds.outputs.configured == 'true'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: mobile/package.json

      - name: Install dependencies
        if: steps.creds.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate native iOS project (expo prebuild)
        if: steps.creds.outputs.configured == 'true'
        env:
          JUNKET_IOS_BUNDLE_ID: ${{ vars.JUNKET_IOS_BUNDLE_ID }}
          JUNKET_IOS_BUILD_NUMBER: ${{ github.run_number }}
          # Optional override; must be absolute. Unset -> the app's production default.
          EXPO_PUBLIC_API_URL: ${{ vars.MOBILE_API_URL }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: pnpm exec expo prebuild --platform ios

      - name: Write App Store Connect API key
        if: steps.creds.outputs.configured == 'true'
        run: |
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/AuthKey.p8" ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive (cloud-managed signing)
        if: steps.creds.outputs.configured == 'true'
        env:
          JUNKET_IOS_BUNDLE_ID: ${{ vars.JUNKET_IOS_BUNDLE_ID }}
          JUNKET_IOS_BUILD_NUMBER: ${{ github.run_number }}
          # Optional override; must be absolute. Unset -> the app's production default.
          EXPO_PUBLIC_API_URL: ${{ vars.MOBILE_API_URL }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          xcodebuild -version
          xcodebuild archive \
            -workspace ios/Junket.xcworkspace \
            -scheme Junket \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Junket.xcarchive" \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Export IPA
        if: steps.creds.outputs.configured == 'true'
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Junket.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload IPA artifact
        if: steps.creds.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Junket-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      - name: Upload to TestFlight
        if: steps.creds.outputs.configured == 'true'
        run: |
          IPA_PATH=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
          echo "Uploading $IPA_PATH"
          xcrun altool --upload-app --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
